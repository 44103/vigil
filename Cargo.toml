[package]
name = "vigil"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1.3"
active-win-pos-rs = "0.9"
sysinfo = "0.30"
chrono = "0.4"
appkit-nsworkspace-bindings = "0.1.2"
reqwest = { version = "0.12", features = ["json", "blocking"] }
directories = "5.0"
dirs = "5.0"
config = "0.14"
toml = "0.8"
include_dir = "0.7.4"

[[bin]]
name = "vigild"
path = "src/bin/vigild.rs"

[[bin]]
name = "vigil"
path = "src/bin/vigil.rs"

[[bin]]
name = "vigil-logger"
path = "src/bin/logger.rs"

[[bin]]
name = "vigil-installer"
path = "src/bin/installer.rs"
