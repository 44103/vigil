[package]
name = "vigil"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1.3"
active-win-pos-rs = "0.9"
sysinfo = "0.30"
chrono = "0.4" # Added for date and time handling
appkit-nsworkspace-bindings = "0.1.2"

[[bin]]
name = "vigil-logger"
path = "src/bin/logger.rs"

